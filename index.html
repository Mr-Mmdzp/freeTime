<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Periodic Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">Periodic<span>Quiz</span></div>

    <div class="lang-menu" id="langMenu">
        <button id="langToggle">
            🌐 <span id="currentLang">فارسی</span>
        </button>

        <div class="lang-dropdown">
            <button class="lang-option fa">فارسی</button>
            <button class="lang-option en">English</button>
        </div>
    </div>
</header>


<main>

    <section class="hero">
        <h1 class="dynamic"
            data-persian="تمرین جدول تناوبی"
            data-english="Periodic Table Quiz">
            تمرین جدول تناوبی
        </h1>

        <p class="dynamic"
           data-persian="یک گروه را انتخاب کن و عنصر تصادفی را حدس بزن."
           data-english="Choose a group and guess the random element.">
            یک گروه را انتخاب کن و عنصر تصادفی را حدس بزن.
        </p>
    </section>


    <section class="groups">

        <button class="groupBtn group1 active ">
            <span class="dynamic" data-english="Group" data-persian="گروه" >گروه</span> 1
        </button>

        <button class="groupBtn group2 ">
            <span class="dynamic" data-english="Group" data-persian="گروه" >گروه</span> 2
        </button>

        <button class="groupBtn group13 ">
            <span class="dynamic" data-english="Group" data-persian="گروه" >گروه</span> 13
        </button>

        <button class="groupBtn group14 ">
            <span class="dynamic" data-english="Group" data-persian="گروه" >گروه</span> 14
        </button>

        <button class="groupBtn group15 ">
            <span class="dynamic" data-english="Group" data-persian="گروه" >گروه</span> 15
        </button>

        <button class="groupBtn group16 ">
            <span class="dynamic" data-english="Group" data-persian="گروه" >گروه</span> 16
        </button>

        <button class="groupBtn group17 ">
            <span class="dynamic" data-english="Group" data-persian="گروه" >گروه</span> 17
        </button>

        <button class="groupBtn group18 ">
            <span class="dynamic" data-english="Group" data-persian="گروه" >گروه</span> 18
        </button>

    </section>


    <section class="quiz">

        <button id="randomBtn" class="randomBtn dynamic"
                data-persian="🎲 عنصر تصادفی"
                data-english="🎲 Random Element">
            🎲 عنصر تصادفی
        </button>


        <div class="element-card">

            <div class="atomic-number">
                <small class="dynamic"
                      data-persian="عدد اتمی"
                      data-english="Atomic Number">
                    عدد اتمی
                </small>

                <strong id="elementNumber">??</strong>
            </div>


            <div class="symbol" id="elementSymbol">
                ?
            </div>


            <div class="element-name">
                <span id="elementName">???</span>
            </div>

        </div>


        <div class="inputs">

            <div class="input-box">

                <label class="dynamic"
                       data-persian="نام عنصر"
                       data-english="Element Name">
                    نام عنصر
                </label>

                <input
                    type="text"
                    id="nameInput"
                    class="dynamic"
                    data-persian="مثلاً هیدروژن"
                    data-english="Example: Hydrogen"
                    placeholder="مثلاً هیدروژن"
                >

            </div>


            <div class="input-box">

                <label class="dynamic"
                       data-persian="عدد اتمی"
                       data-english="Atomic Number">
                    عدد اتمی
                </label>

                <input
                    type="number"
                    id="atomicInput"
                    class="dynamic"
                    data-persian="مثلاً 1"
                    data-english="Example: 1"
                    placeholder="مثلاً 1"
                >

            </div>

        </div>


        <button id="checkBtn" class="checkBtn dynamic"
                data-persian="بررسی جواب"
                data-english="Check Answer">
            بررسی جواب
        </button>


        <div id="result"></div>

    </section>

</main>


<footer>
    <p class="dynamic"
       data-persian="برای تمرین ساخته شده ❤️"
       data-english="Made for practice ❤️">
        برای تمرین ساخته شده ❤️
    </p>
</footer>


<script src="script.js"></script>

</body>
</html>
